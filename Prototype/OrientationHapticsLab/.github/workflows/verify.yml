name: Verify
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test calculation module
        run: swift test --package-path Packages/OrientationCore
      - name: Build iPhone app
        run: >-
          xcodebuild -project OrientationHapticsLab.xcodeproj
          -scheme OrientationHapticsLab -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build-results/DerivedData
          CODE_SIGNING_ALLOWED=NO build
      - name: Test app settings and storage
        shell: bash
        run: |
          LAB_SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(v["udid"] for k,vs in d.items() if "iOS-" in k and int(k.split("iOS-")[-1].split("-")[0]) >= 26 for v in vs if v["name"].startswith("iPhone")))')
          xcodebuild -project OrientationHapticsLab.xcodeproj \
            -scheme OrientationHapticsLab \
            -destination "platform=iOS Simulator,id=$LAB_SIMULATOR_ID" \
            -derivedDataPath .build-results/AppTests \
            CODE_SIGNING_ALLOWED=NO test
