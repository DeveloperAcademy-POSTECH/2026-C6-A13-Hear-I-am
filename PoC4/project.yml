name: PoC4
options:
  bundleIdPrefix: org.heariam
  deploymentTarget:
    iOS: "17.0"
packages:
  PoC4Core:
    path: Packages/PoC4Core
settings:
  base:
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSCameraUsageDescription: 무대 메시 스캔과 착용 위치 추적을 위해 카메라를 사용합니다.
    INFOPLIST_KEY_CFBundleDisplayName: Hear I am 히얼아이엠
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PoC4:
    type: application
    platform: iOS
    sources: [PoC4]
    dependencies:
      - package: PoC4Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.heariam.poc4.scanlab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  PoC4:
    build:
      targets:
        PoC4: all
